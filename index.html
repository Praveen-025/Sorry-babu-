<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From a Broken Heart 💔</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(180deg,#0b0006,#000);
  color:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* SLOW FLOATING HEARTS (LIKE TEARS) */
.heart{
  position:absolute;
  font-size:16px;
  opacity:0.25;
  animation:float 14s linear infinite;
}
@keyframes float{
  from{transform:translateY(110vh);}
  to{transform:translateY(-15vh);}
}

/* LETTER */
#letter{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.95);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.letter-box{
  background:linear-gradient(160deg,#1a000d,#000);
  padding:28px;
  border-radius:20px;
  max-width:90%;
  text-align:center;
  animation:fadeSlow 2.5s ease;
}
.letter-box h2{
  color:#ff8fa3;
  font-weight:500;
}
.letter-box p{
  font-size:14px;
  opacity:0.8;
  line-height:1.6;
}
.letter-box button{
  margin-top:20px;
  padding:12px 32px;
  border:none;
  border-radius:30px;
  background:#ff5c8a;
  color:#fff;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(255,92,138,0.4);
  transition:0.4s;
}
.letter-box button:hover{
  box-shadow:0 0 15px rgba(255,92,138,0.6);
}

/* APP */
#app{
  display:none;
  width:100%;
  max-width:420px;
  padding:20px;
}
.card{
  background:rgba(255,255,255,0.05);
  border-radius:22px;
  padding:26px;
  box-shadow:0 0 35px rgba(255,0,80,0.12);
  animation:fadeSlow 2s ease;
}
@keyframes fadeSlow{
  from{opacity:0;}
  to{opacity:1;}
}
.question{
  margin-bottom:18px;
  font-size:17px;
  line-height:1.5;
  color:#ffd6de;
}

/* TEXT ANSWER */
textarea{
  width:100%;
  min-height:95px;
  border-radius:14px;
  border:none;
  padding:12px;
  font-size:15px;
  background:rgba(255,255,255,0.08);
  color:#fff;
  outline:none;
}

/* SLIDER */
.range-wrap{
  text-align:center;
}
input[type=range]{
  width:100%;
  margin-top:10px;
}
.percent{
  margin-top:12px;
  font-size:20px;
  color:#ffb3c6;
}

/* BUTTON */
button{
  margin-top:20px;
  padding:13px 26px;
  border:none;
  border-radius:28px;
  background:#ff5c8a;
  color:#fff;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(255,92,138,0.35);
  transition:0.5s;
}
button:active{
  transform:scale(0.97);
}
</style>
</head>

<body>

<script>
for(let i=0;i<12;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💔";
  h.style.left=Math.random()*100+"%";
  h.style.animationDuration=12+Math.random()*8+"s";
  document.body.appendChild(h);
}
</script>

<!-- LETTER -->
<div id="letter">
  <div class="letter-box">
    <h2>💔 Ek Aakhri Request</h2>
    <p>
      Please dil se jawab dena…<br>
      Mazak ya gusse se nahi 😔<br><br>
      Ye sawal mere liye bahut gehre hai
    </p>
    <button onclick="start()">Start</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="card">
    <div class="question" id="question"></div>

    <textarea id="textAnswer" placeholder="Yahan likho..."></textarea>

    <div id="rangeBox" class="range-wrap" style="display:none">
      <input type="range" min="0" max="100" value="50" oninput="updatePercent(this.value)">
      <div class="percent" id="percent">50%</div>
    </div>

    <button onclick="next()">Next</button>
  </div>
</div>

<script>
const textQuestions=[
"Kya tum mujhe sach mai pyar nhi karti?",
"Agar nhi karti to uska reason please sach sach likho",
"Kya mere sudharne se tum mere sath rahogi?",
"Mai kya karke tumhara biswas phirse jeet sakta hu?",
"Tum mujhe dost bol rahi ho par kya future ka koi chance hai?"
];

const rangeQuestions=[
"Mere upar abhi tumhara pyar kitna bacha hai?",
"Agar mai tumhe dobara hurt na karu to sath rehne ka chance?",
"Agar mai tumhari har baat maan lu to pyar ka chance kitna?"
];

let step=0;
let answers=[];

function start(){
  letter.style.display="none";
  app.style.display="block";
  show();
}

function show(){
  if(step < textQuestions.length){
    question.innerText=textQuestions[step];
    textAnswer.style.display="block";
    rangeBox.style.display="none";
    textAnswer.value="";
  }else{
    let r=step-textQuestions.length;
    question.innerText=rangeQuestions[r];
    textAnswer.style.display="none";
    rangeBox.style.display="block";
    updatePercent(50);
  }
}

function updatePercent(v){
  percent.innerText=v+"%";
  rangeBox.querySelector("input").value=v;
}

function next(){
  if(step < textQuestions.length){
    if(!textAnswer.value.trim()){
      alert("Please kuch likho… 😔");
      return;
    }
    answers.push(textAnswer.value.trim());
  }else{
    answers.push(rangeBox.querySelector("input").value+"%");
  }
  step++;
  if(step < textQuestions.length + rangeQuestions.length){
    show();
  }else{
    sendWhatsApp();
  }
}

function sendWhatsApp(){
  let msg="💔 Dil Se Jawab 💔\n\n";
  textQuestions.forEach((q,i)=>{
    msg+=`Q${i+1}: ${q}\nAns: ${answers[i]}\n\n`;
  });
  rangeQuestions.forEach((q,i)=>{
    msg+=`Q${i+6}: ${q}\nAns: ${answers[i+5]}\n\n`;
  });
  location.href="https://wa.me/917337013972?text="+encodeURIComponent(msg);
}
</script>

</body>
</html>
