<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From My Heart 💔</title>

<style>
*{
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}
body{
  margin:0;
  height:100vh;
  background:linear-gradient(135deg,#2b0a1f,#000);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* POPUP LETTER */
#letter{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
}
.letter-box{
  background:linear-gradient(145deg,#4a0d2f,#1a000f);
  padding:25px;
  border-radius:20px;
  text-align:center;
  max-width:90%;
  animation:fadeIn 1s ease;
}
.letter-box h2{
  margin-bottom:10px;
  color:#ff9dbb;
}
.letter-box p{
  font-size:15px;
  opacity:0.9;
}
.letter-box button{
  margin-top:15px;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  background:#ff4d88;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 15px #ff4d88;
}

/* MAIN CARD */
#app{
  width:100%;
  max-width:420px;
  padding:20px;
  text-align:center;
  animation:fadeIn 1s ease;
}
.card{
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  padding:25px;
  box-shadow:0 0 30px rgba(255,0,100,0.2);
}
.question{
  font-size:18px;
  margin-bottom:15px;
}
textarea{
  width:100%;
  min-height:90px;
  border-radius:12px;
  border:none;
  padding:10px;
  font-size:15px;
  resize:none;
  outline:none;
}
button{
  margin-top:15px;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4d88;
  color:white;
  font-size:16px;
  cursor:pointer;
  box-shadow:0 0 12px #ff4d88;
}
button:active{
  transform:scale(0.95);
}

/* ANIMATIONS */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.heart{
  position:absolute;
  color:#ff4d88;
  font-size:18px;
  animation:float 6s linear infinite;
  opacity:0.4;
}
@keyframes float{
  0%{transform:translateY(100vh);}
  100%{transform:translateY(-10vh);}
}
</style>
</head>

<body>

<!-- FLOATING HEARTS -->
<script>
for(let i=0;i<15;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="💔";
  h.style.left=Math.random()*100+"%";
  h.style.animationDuration=4+Math.random()*4+"s";
  document.body.appendChild(h);
}
</script>

<!-- LETTER POPUP -->
<div id="letter">
  <div class="letter-box">
    <h2>💔 Ek Zaroori Baat</h2>
    <p>
      Please dil se answer karna 🥺<br>
      Bahut jyada important hai mere liye 💔
    </p>
    <button onclick="start()">Start</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">
  <div class="card">
    <div class="question" id="question"></div>
    <textarea id="answer" placeholder="Yahan likho..."></textarea>
    <button onclick="next()">Next</button>
  </div>
</div>

<script>
const questions=[
"Kya tum mujhe sach mai pyar nhi karti?",
"Agar nhi karte pyar to pls uska koi reason hai to bolo clearly",
"kya mere acche se rehne se tum mere sath rahogi?",
"Mere upar biswas nhi hoga par mai kya karke tumhe biswas dila sakta hu?",
"Abhi mujhe dost bola par tumhara har baat manke tumhare liye rahunga to kya phirse mere sath rehne ka sochoge?"
];

let index=0;
let answers=[];

function start(){
  document.getElementById("letter").style.display="none";
  document.getElementById("app").style.display="block";
  show();
}

function show(){
  document.getElementById("question").innerText="💔 "+questions[index];
  document.getElementById("answer").value=answers[index]||"";
}

function next(){
  let val=document.getElementById("answer").value.trim();
  if(!val){
    alert("Please kuch likho... 🥺");
    return;
  }
  answers[index]=val;
  index++;

  if(index<questions.length){
    show();
  }else{
    sendWhatsApp();
  }
}

function sendWhatsApp(){
  let text="💔 Dil Se Jawab 💔\n\n";
  questions.forEach((q,i)=>{
    text+=`Q${i+1}: ${q}\nAns: ${answers[i]}\n\n`;
  });
  let url="https://wa.me/917337013972?text="+encodeURIComponent(text);
  window.location.href=url;
}
</script>

</body>
</html>
